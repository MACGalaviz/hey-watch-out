<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';" />
    <title>Mini Bar</title>
    <link rel="stylesheet" href="minibar.css" />
  </head>
  <body>
    <div class="bar" id="bar">
      <img class="icon" src="../assets/tray@2x.png" alt="" />
      <div class="content">
        <span class="label" id="label">--:--</span>
        <div class="track" aria-hidden="true">
          <div class="fill" id="fill"></div>
        </div>
      </div>
      <button class="btn icon-btn" id="reset" title="Restart" aria-label="Restart">
        <svg class="ic ic-stroke" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
      <button class="btn icon-btn" id="pause" title="Pause" aria-label="Pause">
        <svg class="ic ic-pause" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3.75" y="2" width="3" height="12" rx="0.6"/>
          <rect x="9.25" y="2" width="3" height="12" rx="0.6"/>
        </svg>
        <svg class="ic ic-play" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5.5 3.5 L12 8 L5.5 12.5 Z"/>
        </svg>
      </button>
      <button class="btn icon-btn" id="open" title="Settings" aria-label="Settings">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96a7 7 0 0 0 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
        </svg>
      </button>
    </div>
    <script src="minibar.js"></script>
  </body>
</html>
